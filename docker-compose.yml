version: '3.8'

services:
  go-app:
    build: .
    container_name: test_go_service
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgres://${DB_USER}:${DB_PASSWORD}@global_postgres:5432/${DB_NAME}?sslmode=disable
    ports:
      - "8081:8080"
    networks:
      - web-network

networks:
  web-network:
    external: true